---
layout: default
---
<div class="post-layout">
  <article class="post">
    <header>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
      {% if page.categories.size > 0 %}
        <p class="post-categories">{% for category in page.categories %}<a href="{{ '/' | relative_url }}#category-{{ category | slugify }}">{{ category }}</a>{% endfor %}</p>
      {% endif %}
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>
    {{ content }}
  </article>

  <aside class="article-nav" aria-label="On this page">
    <h2>On this page</h2>
    <nav data-generated-toc></nav>
  </aside>
</div>

<script>
  (() => {
    const layout = document.querySelector('.post-layout');
    const sidebar = document.querySelector('.article-nav');
    const toc = document.querySelector('[data-generated-toc]');
    const headings = [...document.querySelectorAll('.post h2[id], .post h3[id], .post h4[id], .post h5[id], .post h6[id]')];
    if (!layout || !sidebar || !toc || !headings.length) {
      if (sidebar) sidebar.hidden = true;
      if (layout) layout.classList.add('post-layout--plain');
      return;
    }

    const links = new Map();
    headings.forEach(heading => {
      const link = document.createElement('a');
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;
      const level = Number(heading.tagName.slice(1));
      link.dataset.level = level;
      link.style.setProperty('--toc-indent', `${Math.max(0, level - 2) * .9}rem`);
      toc.append(link);
      links.set(heading.id, link);
    });

    const setActive = id => links.forEach((link, key) => link.classList.toggle('is-active', key === id));
    setActive(headings[0].id);
    const observer = new IntersectionObserver(entries => {
      const visible = entries.filter(entry => entry.isIntersecting);
      if (visible.length) setActive(visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0].target.id);
    }, { rootMargin: '-18% 0px -70% 0px', threshold: 0 });
    headings.forEach(heading => observer.observe(heading));
  })();
</script>
