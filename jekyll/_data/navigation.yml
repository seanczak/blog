# Header links, in display order. `url` is site-relative (run through relative_url);
# `external: true` opens in a new tab and is used as-is. A link with `icon: <name>`
# shows jekyll/_includes/icons/<name>.svg in the header, with its title as the label;
# links without an icon are listed in the header's menu.
- title: Topics
  url: /
- title: Archive
  url: /archive/
- title: About
  url: /about/
- title: LinkedIn
  url: https://www.linkedin.com/in/sean-fronczak/
  icon: linkedin
  external: true
- title: GitHub
  url: https://github.com/seanczak/blog
  icon: github
  external: true
