# Landing-page topic tree. Order here is display order.
# section -> groups -> posts. A post is referenced by its file name minus the
# date (post.slug), e.g. 2026-09-26-pricing-model-test.md -> pricing-model-test.
# Each post's blurb is its front-matter `description` unless `blurb` is set here.
# A post left out of this file still appears on /archive/.
# Sections get a blurb only when they have no groups; otherwise blurbs go on groups.
# Wrap a value in double quotes if it contains ": " or starts with a quote or #.
# Every section and group needs a unique `id`. It is the landing-page anchor
# (/#<id>) that posts link to, so titles can be renamed freely; changing an id
# breaks those links (see "Renaming breaks links" in docs/site/publishing.md).

- title: AI workflow
  id: ai
  groups:
    - title: Exploratory work with AI
      id: ai-exploration
      blurb: "Posts on building an investigation jetpack: an exploration environment that humans can read and agents can navigate, with an eye on token efficiency and idea organization."
      posts:
        - slug: pricing-model-test
          blurb: How prompt caching shapes the cost of a long agent session.
    - title: Coding with AI
      id: ai-coding
      blurb: Posts on maximizing velocity with coding agents while keeping cost, quality and maintainability in check.
      posts:
        - slug: agentic-coding-for-ml-pipelines-part-1

- title: Statistics
  id: statistics
  groups:
    - title: Experimentation
      id: experimentation
    - title: Causal inference
      id: causal-inference
      blurb: Estimating effects when randomization isn't available.
    - title: 2020 election series
      id: election-2020
      blurb: Statistics as a coping mechanism for a nerve-racking election week.
      posts:
        - slug: calling-elections-early-fake-news-or-statistics
        - slug: what-in-the-world-happened-in-virginia-tuesday-night
        - slug: how-swing-able-is-texas-anyways
        - slug: what-took-so-long-in-the-swing-states

- title: Personal finance
  id: personal-finance
  groups:
    - title: Retirement
      id: retirement
      posts:
        - slug: an-approximation-for-financial-independence
    - title: Budgeting
      id: budgeting

- title: About this blog
  id: about-this-blog
  groups:
    - title: How it's built
      id: blog-build
