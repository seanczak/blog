<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/jekyll/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    {% include site-header.html %}
    <main>
      {{ content }}
    </main>
    <footer>
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
    </footer>
    {% comment %}A page or layout names its behavior in front matter: `script: <file name without .js>`.{% endcomment %}
    {% assign script = page.script | default: layout.script %}
    {% if script %}<script src="{{ '/jekyll/assets/js/' | append: script | append: '.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
