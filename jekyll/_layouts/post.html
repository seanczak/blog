---
layout: default
script: post-toc
---
<div class="post-layout">
  <article class="post">
    <header>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
      {% include category-pills.html categories=page.tags %}
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>
    {{ content }}
  </article>

  <aside class="article-nav" aria-label="On this page">
    <h2>On this page</h2>
    <nav data-generated-toc></nav>
  </aside>
</div>
