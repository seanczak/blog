title: Sean Fronczak
description: Notes, experiments, and things worth remembering.
url: "https://seanczak.github.io"
baseurl: "/blog"
permalink: /:year/:month/:day/:title/
markdown: kramdown
timezone: America/Los_Angeles

# Serving machinery lives in jekyll/; posts live in content/<area>/<idea>/_posts/.
layouts_dir: jekyll/_layouts
data_dir: jekyll/_data
includes_dir: jekyll/_includes
sass:
  sass_dir: jekyll/_sass
  style: compressed

# Whitelisted on GitHub Pages. Lets a moved post keep its old URL via `redirect_from:`.
plugins:
  - jekyll-redirect-from

exclude:
  - notshared
  - docs
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - jekyll/Gemfile
  - jekyll/Gemfile.lock
  - jekyll/vendor
  - jekyll/serve.sh
  - "content/**/notes.md"
  - "content/**/outline.md"
  - "content/**/src"
  - "content/**/notshared"
